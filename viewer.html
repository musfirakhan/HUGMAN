<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Humanoid Model Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #ededed;
      color: #222;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .header {
      text-align: center;
      padding: 48px 0 32px 0;
    }
    .header-title {
      font-size: 3.2rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }
    .header-desc {
      color: #666;
      font-size: 1.2rem;
      font-weight: 400;
    }
    .main-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .glass-card {
      background: #f5f5f5;
      border-radius: 16px;
      box-shadow: 0 2px 8px 0 #bbb;
      border: 1px solid #ddd;
      backdrop-filter: none;
      padding: 36px 32px 32px 32px;
      min-width: 340px;
      max-width: 420px;
      flex: 1 1 340px;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #222;
    }
    .section-title .icon {
      font-size: 1.3rem;
    }
    .prompt-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .prompt-textarea {
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 18px;
      color: #222;
      font-size: 1rem;
      resize: none;
      height: 100px;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .prompt-textarea:focus {
      outline: none;
      border-color: #a78bfa;
      box-shadow: 0 0 0 2px #a78bfa44;
    }
    .btn-primary {
      background: #bbb;
      border: none;
      padding: 14px 0;
      border-radius: 10px;
      color: #222;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px 0 #bbb;
    }
    .btn-primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 2px 8px 0 #bbb;
    }
    .suggestions {
      margin-top: 28px;
    }
    .suggestions h3 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #888;
    }
    .suggestion-item {
      background: #ededed;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s, border 0.2s, transform 0.2s;
      font-size: 0.98rem;
      color: #444;
    }
    .suggestion-item:hover {
      background: #e0e0e0;
      border-color: #bbb;
      color: #222;
      transform: translateX(6px);
    }
    .preview-card {
      background: #f5f5f5;
      border-radius: 16px;
      box-shadow: 0 2px 8px 0 #bbb;
      border: 1px solid #ddd;
      backdrop-filter: none;
      padding: 32px 28px 24px 28px;
      min-width: 420px;
      max-width: 600px;
      flex: 1 1 420px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .preview-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #222;
    }
    .preview-title .icon {
      font-size: 1.3rem;
    }
    .preview-box {
      background: #e0e0e0;
      border-radius: 12px;
      min-height: 340px;
      height: 340px;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 2px 16px 0 rgba(99,102,241,0.10);
      position: relative;
      overflow: hidden;
    }
    #viewer-panel {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: transparent;
      border-radius: 12px;
      max-width: 100%;
      max-height: 100%;
    }
    @media (max-width: 1100px) {
      .main-grid {
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
      }
      .glass-card, .preview-card {
        min-width: 0;
        max-width: 100vw;
      }
    }
    @media (max-width: 700px) {
      .header-title { font-size: 2.1rem; }
      .main-grid { padding: 0 4vw; }
      .glass-card, .preview-card { padding: 18px 6vw 18px 6vw; }
      .preview-box { min-height: 220px; height: 220px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">3D Humanoid Model Generator</div>
    <div class="header-desc">Type your idea. Watch it become a 3D model.</div>
  </div>
  <div class="main-grid">
    <div class="glass-card">
      <div class="section-title"><span class="icon"></span> Create Your Character</div>
      <form class="prompt-form" method="post" action="/">
        <textarea class="prompt-textarea" name="prompt" id="prompt-input" placeholder="Describe your character in detail..." required></textarea>
        <button class="btn-primary" type="submit">Generate Character</button>
      </form>
      <div class="suggestions">
        <h3>Try these examples:</h3>
        <div class="suggestion-item" onclick="setPrompt('Cool asian girl of age 20 with sunglasses')">Cool asian girl of age 20 with sunglasses</div>
        <div class="suggestion-item" onclick="setPrompt('Tall caucasian man in business suit')">Tall caucasian man in business suit</div>
        <div class="suggestion-item" onclick="setPrompt('Sporty asian in tracksuit')">Sporty asian in tracksuit</div>
      </div>
    </div>
    <div class="preview-card">
      <div class="preview-title"><span class="icon"></span> 3D Preview</div>
      <div class="preview-box">
        <div id="viewer-panel"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> 
  
  <script type="module">
    import { LoopSubdivision } from '/static/LoopSubdivision.js';
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f4);
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    camera.position.set(-1.03, 10.51, -30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0xf4f4f4, 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('viewer-panel').appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 10, 0);
    controls.update();
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.6);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    const mtlLoader = new THREE.MTLLoader();
    mtlLoader.setPath('./');
    const modelBase = "{{ model_base }}";
    const objUrl = `${modelBase}.obj`;
    const mtlUrl = `${modelBase}.mtl`;
    mtlLoader.load(mtlUrl, function (materials) {
      materials.preload();

      
      const textureLoader = new THREE.TextureLoader();
      const eyeTexture = textureLoader.load("{{ eye_texture_path }}");
      eyeTexture.wrapS = THREE.RepeatWrapping;
      eyeTexture.wrapT = THREE.RepeatWrapping;
      eyeTexture.offset.set(0.71, 0.71);
      eyeTexture.needsUpdate = true;
      const iterations = 10;
      const params = {
        split: true,
        uvSmooth: false,
        preserveEdges: false,
        flatOnly: false,
        maxTriangles: Infinity,
      };
      const objLoader = new THREE.OBJLoader();
      objLoader.setMaterials(materials);
      objLoader.setPath('./');
      objLoader.load(objUrl, function (object) {
        object.scale.set(1, 1, 1);
        object.position.set(0, 0, 0);
        object.userData.rotationSpeed = 0.01;
        object.userData.bobSpeed = 0.02;
        object.userData.bobHeight = 0.5;
        object.userData.originalY = 0;
        object.traverse((child) => {
          if (child.isMesh) {
            const mat = child.material;
            console.log('Material name:', mat.name);
            child.geometry = LoopSubdivision.modify(child.geometry, iterations, params);
            child.geometry.computeVertexNormals();
            if (mat.opacity === 0) {
              mat.opacity = 1;

              mat.needsUpdate = true;
              mat.transparent = false;
              mat.needsUpdate = true;
              mat.shininess = 2;
              mat.specular = new THREE.Color(0x111111);
              //mat.color.multiplyScalar(0.7);
              mat.needsUpdate = true;
            }
            if (
              mat.name.toLowerCase().includes("eye") &&
              !mat.name.toLowerCase().includes("brow")
            ) {
              console.warn(" fixing texture");
              mat.map = eyeTexture;
              mat.needsUpdate = true;
            }
            mat.flatShading = false;
            mat.needsUpdate = true;
          }
        });
        scene.add(object);
        window.animatedObject = object;
      });
    });
    function animate() {
      requestAnimationFrame(animate);
      if (window.animatedObject) {
        const obj = window.animatedObject;
        obj.rotation.y += obj.userData.rotationSpeed;
        const scale = 1 + Math.sin(Date.now() * 0.001) * 0.02;
        obj.scale.set(scale, scale, scale);
      }
      controls.update();
      renderer.render(scene, camera);

    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
  <script>
    function setPrompt(text) {
      document.getElementById('prompt-input').value = text;
    }
  </script>
  <script>
    fetch('/list_textures')
      .then(response => response.json())
      .then(files => {
        if (Array.isArray(files)) {
          const eye_texture_path = files.find(
            f => f.toLowerCase().includes('eye') && !f.toLowerCase().includes('brow')
          );
          if (eye_texture_path) {
            const textureLoader = new THREE.TextureLoader();
            const eyeTexture = textureLoader.load(eye_texture_path, function(texture) {

              //texture.needsUpdate = true;
              console.log(eye_texture_path);


            });
          } else {
            console.error('No eye texture found!');
          }
        } else {
          console.error('Error:', files.error);
        }
      });
  </script>
</body>
</html>
